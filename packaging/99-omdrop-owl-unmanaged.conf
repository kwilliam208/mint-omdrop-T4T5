# NetworkManager must not manage the interfaces omdrop-owl creates.
#
# awdl0 is OWL's tap device: a managed one is given a randomised MAC and no
# IPv6 link-local, and the link-local is the only address a transfer can be
# delivered to. mon0 is the monitor interface OWL injects through, and
# awdlibss0 the ad-hoc interface of exclusive mode.
#
# A [device-*] section of our own, not keyfile's unmanaged-devices: that is a
# single key, and whichever conf.d file sorts last replaces it outright. Linux
# Mint's ubuntu-system-adjustments.conf sets unmanaged-devices=none and sorts
# after this file, so the key silently stopped applying there. No other file
# uses this section's name, and leaving unmanaged-devices alone also keeps any
# devices the user listed there unmanaged. 86-omdrop-owl-unmanaged.rules marks
# the same interfaces through udev as well.
#
# This is the vendor copy. Override it with a file of the same name in
# /etc/NetworkManager/conf.d/, which NetworkManager reads after this one.
[device-omdrop-owl]
match-device=interface-name:awdl0,interface-name:mon0,interface-name:awdlibss0
managed=0
